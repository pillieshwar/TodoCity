name: Scorecard

# OpenSSF Scorecard: grades the repository's security practices and powers
# the badge in the README. Results appear under Security → Code scanning.
# https://github.com/ossf/scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 15 * * 2" # Tuesdays
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Publish results for the badge, and upload them to code scanning.
      id-token: write
      security-events: write
      contents: read
      actions: read
    # Only `uses` steps here: api.scorecard.dev refuses results from a job
    # with `run` steps, and the badge would stay stale.
    # https://github.com/ossf/scorecard-action#workflow-restrictions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The public badge only reflects main; runs on a branch just report.
          publish_results: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif

  # Every score in the run summary, from a second run that publishes nothing
  # (kept out of the job above, which may only have `uses` steps).
  summary:
    name: Scorecard summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.json
          results_format: json
          publish_results: false
      - name: Scores
        run: |
          jq -r '"::notice title=Scorecard \(.score)/10::\(.date) at \(.repo.commit[0:7])"' results.json
          # (At most 10 notes per step: the lowest 9 here, the rest below.)
          jq -r '.checks | sort_by(.score) | .[0:9][] | "::notice title=\(.name) \(if .score < 0 then "n/a" else "\(.score)/10" end)::\(.reason)"' results.json
          {
            echo "## Scorecard: $(jq -r .score results.json)/10"
            echo
            echo "| Check | Score | Why |"
            echo "|---|---|---|"
            jq -r '.checks | sort_by(.score) | .[] | "| \(.name) | \(.score) | \(.reason) |"' results.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Scores (the rest)
        run: |
          jq -r '.checks | sort_by(.score) | .[9:][] | "::notice title=\(.name) \(if .score < 0 then "n/a" else "\(.score)/10" end)::\(.reason)"' results.json
