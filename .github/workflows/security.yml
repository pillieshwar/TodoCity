name: Security

# Known-vulnerability and supply-chain checks, on every pull request, on
# main, and weekly (new advisories appear without any code changing).
#
# - cargo-deny: Rust advisories (vulnerable, yanked, unmaintained), and only
#   crates.io as a source. Policy in deny.toml.
# - npm audit: npm advisories for the frontend and build tools.
# - OSV-Scanner: every lockfile against the OSV database.
# - zizmor: security mistakes in these GitHub Actions workflows.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1" # Mondays
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: Rust advisories (cargo-deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DENY_VERSION: "0.20.2"
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny (pinned release, checksum verified)
        run: |
          name="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${name}.tar.gz"
          echo "${DENY_SHA256}  deny.tgz" | sha256sum -c -
          tar -xzf deny.tgz
          install "${name}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - name: Check
        # Findings are printed as annotations, so they're readable from the
        # run summary (and the API) without opening the raw log.
        run: |
          set +e
          cargo deny --format json check advisories sources 2> deny.json
          status=$?
          python3 scripts/deny-report.py deny.json
          exit $status

  npm-audit:
    name: npm advisories (npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # High and critical fail the check; lower ones are listed in the log.
      - run: npm audit --audit-level=high

  osv:
    name: OSV-Scanner (all lockfiles)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        # Exits non-zero when it finds anything; the next step decides.
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock
            --lockfile=package-lock.json
            --lockfile=scripts/ui-preview/package-lock.json
            --format=json
            --output=osv-results.json
      - name: Report
        # Vulnerabilities fail the check. "Unmaintained" notices are only
        # warnings here; cargo-deny applies the policy for those.
        run: python3 scripts/osv-report.py osv-results.json

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
