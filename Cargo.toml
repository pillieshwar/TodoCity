[workspace]
resolver = "2"
members = ["crates/todocity-core", "src-tauri"]
# Fuzz tests build on their own (nightly, libFuzzer); see fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.4.71"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util", "net", "process", "sync"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
url = "2"
log = "0.4"
