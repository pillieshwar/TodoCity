[package]
name = "todocity"
description = "Select text anywhere, get a private, dated task. Runs a small model locally."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "todocity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
todocity-core = { path = "../crates/todocity-core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
reqwest.workspace = true
url = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
env_logger = "0.11"
iana-time-zone = "0.1"
getrandom = "0.4"
sha2.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# "exception": AppKit can throw when a live window changes style; catch it.
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString", "NSURL", "NSCalendar", "NSError", "NSDate", "NSPredicate", "NSSet", "NSUserDefaults", "NSNotification", "NSOperation"] }
block2 = "0.6"
# Slack tokens live in the login Keychain.
keyring = { version = "3", features = ["apple-native"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "EKCalendar", "EKCalendarItem", "EKEventStore", "EKObject", "EKReminder", "EKSource", "EKTypes", "EKError", "EKEvent", "EKParticipant", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSPanel", "NSColor", "NSColorSpace", "libc"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

# Windows/Linux only: macOS uses native AppKit/Quartz code instead, because
# enigo's macOS backend calls keyboard-layout APIs that crash off the main
# thread.
[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = "3"
enigo = "0.6"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange"] }
